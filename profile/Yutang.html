<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/profile.css" />
    <title>Profile</title>
  </head>
  <body>
    <div class="container">
      <div class="profile-container">
        <img
          class="profile-pic"
          src="../Image/20210111_205446.jpg"
          alt="Profile Image"
        />
        <h2>Yutang Magallanes</h2>
        <p>I'm just a dog</p>
        <p class="quote">
          “It is amazing how much love and laughter they bring into our lives
          and even how much closer we become with each other because of them.”
          <strong> - John Grogan on dogs </strong>
        </p>
        <div class="star-rating">
          <input type="radio" id="rate-5" name="rating" value="5" />
          <label for="rate-5" title="5 stars">★</label>
          <input type="radio" id="rate-4" name="rating" value="4" />
          <label for="rate-4" title="4 stars">★</label>
          <input type="radio" id="rate-3" name="rating" value="3" />
          <label for="rate-3" title="3 stars">★</label>
          <input type="radio" id="rate-2" name="rating" value="2" />
          <label for="rate-2" title="2 stars">★</label>
          <input type="radio" id="rate-1" name="rating" value="1" />
          <label for="rate-1" title="1 star">★</label>
        </div>
        <p>Profile rating:<span id="saved-rating"></span></p>
      </div>
      <div id="action">
        <button onclick="logout()">Logout</button>
      </div>
      <p id="copyright"></p>
    </div>
    <script src="../js/profile.js"></script>
  </body>
</html>
